<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #12355b;
            color: white;
            padding: 22px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 600px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn {
            margin-top: 22px;
            background: #1769aa;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .back {
            margin-left: 10px;
            color: #1769aa;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Edit Student</h1>
    <p>University Academic Management System</p>
</div>

<div class="container">

    <div class="form-box">

        <form method="POST">

            <label>Student ID</label>
            <input
                type="text"
                value="{{ student.student_id }}"
                disabled
            >

            <label>Student Name</label>
            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >

            <label>Gender</label>
            <select name="gender" required>
                <option value="Male"
                    {% if student.gender == "Male" %}selected{% endif %}>
                    Male
                </option>

                <option value="Female"
                    {% if student.gender == "Female" %}selected{% endif %}>
                    Female
                </option>
            </select>

            <label>Date of Birth</label>
            <input
                type="date"
                name="dob"
                value="{{ student.dob }}"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                value="{{ student.email }}"
                required
            >

            <label>Department</label>

            <select name="dept_id" required>

                {% for department in departments %}

                <option
                    value="{{ department.dept_id }}"
                    {% if department.dept_id == student.dept_id %}
                    selected
                    {% endif %}
                >
                    {{ department.dept_id }} - {{ department.dept_name }}
                </option>

                {% endfor %}

            </select>

            <button type="submit" class="btn">
                Update Student
            </button>

            <a href="/students" class="back">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
