<!DOCTYPE html>
<html>
<head>
    <title>Add Faculty - University Academic Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #123b64;
            color: white;
            padding: 25px 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin-top: 10px;
        }

        .container {
            width: 550px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            margin-top: 25px;
            padding: 12px 22px;
            background: #1976c3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel {
            margin-left: 15px;
            color: #1976c3;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Add Faculty</h1>
    <p>University Academic Management System</p>
</div>

<div class="container">

    <h2>Faculty Details</h2>

    <form method="POST">

        <label>Faculty ID</label>
        <input type="text"
               name="faculty_id"
               placeholder="Example: F201"
               required>

        <label>Faculty Name</label>
        <input type="text"
               name="name"
               placeholder="Enter faculty name"
               required>

        <label>Qualification</label>
        <input type="text"
               name="qualification"
               placeholder="Example: M.Tech / Ph.D">

        <label>Department</label>
        <select name="dept_id" required>

            <option value="">Select Department</option>

            {% for department in departments %}

            <option value="{{ department[0] }}">
                {{ department[1] }}
            </option>

            {% endfor %}

        </select>

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="faculty@example.com">

        <button type="submit">
            Add Faculty
        </button>

        <a class="cancel" href="/faculty">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
